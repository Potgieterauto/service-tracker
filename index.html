<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Service Status | Omoda & Jaecoo Hatfield</title>
    <style>
        :root {
            --primary: #111827;
            --accent: #2563eb;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --success: #16a34a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header p {
            margin: 4px 0 0 0;
            font-size: 0.875rem;
            color: var(--muted);
        }

        .info-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: var(--muted);
        }

        .info-value {
            font-weight: 600;
        }

        .timeline {
            position: relative;
            padding-left: 20px;
            margin-top: 20px;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 24px;
            padding-left: 16px;
            border-left: 2px solid #e5e7eb;
        }

        .timeline-item:last-child {
            border-left: 2px solid transparent;
            padding-bottom: 0;
        }

        .timeline-icon {
            position: absolute;
            left: -9px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #d1d5db;
        }

        .timeline-item.active .timeline-icon {
            background-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
        }

        .timeline-item.completed .timeline-icon {
            background-color: var(--success);
        }

        .timeline-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0 0 4px 0;
            color: #9ca3af;
        }

        .timeline-item.active .timeline-title {
            color: var(--accent);
        }

        .timeline-item.completed .timeline-title {
            color: var(--text);
        }

        .notes-box {
            margin-top: 20px;
            background-color: #fffbe0;
            border-left: 4px solid #eab308;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.875rem;
        }

        .error-card {
            text-align: center;
            padding: 40px 20px;
        }

        .error-card h2 {
            color: #dc2626;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Omoda & Jaecoo Hatfield</h1>
        <p>Live Workshop Tracker</p>
    </div>

    <div id="content">
        <div class="loading">Loading vehicle status...</div>
    </div>
</div>

<script>
    // Your published Google Sheets CSV URL
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTv3NaMRF2nGAcEb9fP0EV2bpaonpMKdhvTf8goGCAWhq9GfpkQG1_AqbemXkOEbJio2mk_YUgQs6-W/pub?gid=0&single=true&output=csv';

    const stages = [
        "1. Vehicle Checked In",
        "2. In Bay - Inspection/Diagnostic",
        "3. Work in Progress",
        "4. Awaiting Parts / Customer Approval",
        "5. Quality Control & Wash Bay",
        "6. Ready for Collection"
    ];

    async function fetchStatus() {
        const contentDiv = document.getElementById('content');

        // Extract Reg No from URL query string (?reg=AB12WTGP or ?reg=AB 12 WT GP)
        const urlParams = new URLSearchParams(window.location.search);
        const rawReg = urlParams.get('reg') || '';

        if (!rawReg) {
            contentDiv.innerHTML = `
                <div class="error-card">
                    <h2>No Registration Provided</h2>
                    <p>Please check your link and try again.</p>
                </div>`;
            return;
        }

        // Clean query input: remove non-alphanumeric chars, convert to UPPERCASE
        const targetReg = rawReg.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();

        try {
            const response = await fetch(GOOGLE_SHEET_CSV_URL);
            const csvText = await response.text();
            const rows = parseCSV(csvText);

            // Find row where Col A cleaned matches targetReg cleaned
            const matchingRow = rows.find(r => {
                if (!r[0]) return false;
                const sheetReg = r[0].replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                return sheetReg === targetReg;
            });

            if (!matchingRow) {
                contentDiv.innerHTML = `
                    <div class="error-card">
                        <h2>Vehicle Not Found</h2>
                        <p>No active service found for registration: <strong>${escapeHtml(rawReg)}</strong></p>
                    </div>`;
                return;
            }

            // Extract data from Google Sheet columns
            const regNo = matchingRow[0] || 'N/A';
            const clientName = matchingRow[1] || 'Valued Customer';
            const model = matchingRow[3] || 'Vehicle';
            const technician = matchingRow[4] || 'Assigned Tech';
            const estTime = matchingRow[5] || 'Pending';
            const currentStatus = (matchingRow[6] || '').trim();
            const notes = matchingRow[7] || '';

            // Find index of current status
            let currentStageIndex = stages.findIndex(s => s.toLowerCase() === currentStatus.toLowerCase());
            if (currentStageIndex === -1) {
                // Partial matching fallback
                currentStageIndex = stages.findIndex(s => currentStatus.toLowerCase().includes(s.substring(3).toLowerCase()));
            }

            // Render output
            let timelineHtml = '';
            stages.forEach((stage, index) => {
                let stageClass = '';
                if (index < currentStageIndex) stageClass = 'completed';
                else if (index === currentStageIndex) stageClass = 'active';

                const stageLabel = stage.replace(/^\d+\.\s*/, '');

                timelineHtml += `
                    <div class="timeline-item ${stageClass}">
                        <div class="timeline-icon"></div>
                        <div class="timeline-title">${escapeHtml(stageLabel)}</div>
                    </div>`;
            });

            let notesHtml = '';
            if (notes.trim() !== '') {
                notesHtml = `
                    <div class="notes-box">
                        <strong>Workshop Note:</strong> ${escapeHtml(notes)}
                    </div>`;
            }

            contentDiv.innerHTML = `
                <div class="info-card">
                    <div class="info-row">
                        <span class="info-label">Customer</span>
                        <span class="info-value">${escapeHtml(clientName)}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Vehicle</span>
                        <span class="info-value">${escapeHtml(model)} (${escapeHtml(regNo)})</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Technician</span>
                        <span class="info-value">${escapeHtml(technician)}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Est. Completion</span>
                        <span class="info-value">${escapeHtml(estTime)}</span>
                    </div>
                </div>

                <h3 style="font-size: 1rem; margin-bottom: 12px;">Service Progress</h3>
                <div class="timeline">
                    ${timelineHtml}
                </div>

                ${notesHtml}
            `;

        } catch (error) {
            console.error(error);
            contentDiv.innerHTML = `
                <div class="error-card">
                    <h2>Error Loading Status</h2>
                    <p>Unable to fetch live tracking data. Please refresh the page.</p>
                </div>`;
        }
    }

    // CSV Parser
    function parseCSV(text) {
        const lines = text.split('\n');
        return lines.map(line => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        });
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    fetchStatus();
</script>
</body>
</html>
