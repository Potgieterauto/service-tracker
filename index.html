<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMODA & JAECOO HATFIELD - Live Vehicle Service Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0b1e36;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #f8fafc;
            border-radius: 8px;
        }

        .info-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 15px;
            color: #0f172a;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            background-color: #e2e8f0;
            color: #475569;
        }

        .message-box {
            text-align: center;
            padding: 30px 20px;
        }

        .error-title {
            color: #dc2626;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .error-sub {
            color: #64748b;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Omoda & Jaecoo Hatfield</h1>
            <p>Live Vehicle Service Tracker</p>
        </div>

        <div id="content">
            <div class="loading">Loading vehicle details...</div>
        </div>
    </div>

    <script>
        // Your published Google Sheets CSV URL
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTv3NaMRF2nGAcEb9fP0EV2bpaonpMKdhvTf8goGCAWhq9GfpkQG1_AqbemXkOEbJio2mk_YUgQs6-W/pub?gid=0&single=true&output=csv';

        // Simple CSV Parser handling quotes and commas
        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            const result = [];
            for (let i = 0; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const row = [];
                let insideQuotes = false;
                let entry = '';
                for (let char of lines[i]) {
                    if (char === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        row.push(entry.trim().replace(/^"|"$/g, ''));
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry.trim().replace(/^"|"$/g, ''));
                result.push(row);
            }
            return result;
        }

        // Clean string for accurate comparisons
        function cleanString(str) {
            return str ? str.toString().toUpperCase().replace(/[^A-Z0-9]/g, '') : '';
        }

        async function fetchVehicleData() {
            const contentDiv = document.getElementById('content');
            
            // Get registration from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const targetReg = urlParams.get('reg');

            if (!targetReg) {
                contentDiv.innerHTML = `
                    <div class="message-box">
                        <div class="error-title">No Registration Provided</div>
                        <div class="error-sub">Please use a valid tracking link containing a vehicle registration number.</div>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) {
                    throw new Error('Failed to fetch data from database');
                }

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length < 2) {
                    throw new Error('Database is empty or missing headers');
                }

                const headers = rows[0].map(h => cleanString(h));
                const cleanedTargetReg = cleanString(targetReg);

                // Find matching row by checking registration column or any cell matching reg
                let matchedRow = null;
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    for (let cell of row) {
                        if (cleanString(cell) === cleanedTargetReg) {
                            matchedRow = {};
                            headers.forEach((header, index) => {
                                matchedRow[header] = row[index] || 'N/A';
                            });
                            break;
                        }
                    }
                    if (matchedRow) break;
                }

                if (matchedRow) {
                    displayVehicleInfo(matchedRow, targetReg);
                } else {
                    contentDiv.innerHTML = `
                        <div class="message-box">
                            <div class="error-title">No vehicle found for registration: <span style="color:#1e293b;">${targetReg.toUpperCase()}</span></div>
                            <div class="error-sub">Please check back shortly or call your service advisor.</div>
                        </div>
                    `;
                }

            } catch (error) {
                console.error(error);
                contentDiv.innerHTML = `
                    <div class="message-box">
                        <div class="error-title">Unable to load tracker data</div>
                        <div class="error-sub">Please try refreshing the page or contact support.</div>
                    </div>
                `;
            }
        }

        function displayVehicleInfo(data, originalReg) {
            const contentDiv = document.getElementById('content');
            
            // Extract fields dynamically or fall back gracefully
            let html = '<div class="card">';
            
            for (const [key, value] of Object.entries(data)) {
                if (!key || value === 'N/A') continue;
                html += `
                    <div class="info-row">
                        <span class="info-label">${key}</span>
                        <span class="info-value">${value}</span>
                    </div>
                `;
            }
            
            html += '</div>';
            contentDiv.innerHTML = html;
        }

        // Run on load
        fetchVehicleData();
    </script>
</body>
</html>
