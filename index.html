<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potgieter Auto - Service Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .reg { font-size: 24px; font-weight: bold; color: #007bff; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Potgieter Auto Vehicle Tracking</h1>
        <p>Service Status for Vehicle Registration:</p>
        <div class="reg" id="regDisplay">Loading...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const reg = urlParams.get('reg') || 'Not Provided';
        document.getElementById('regDisplay').textContent = reg;
    </script>
</body>
</html>
