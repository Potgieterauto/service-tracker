<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potgieter Auto | Live Vehicle Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background-color: #1e293b; width: 100%; max-width: 480px; border-radius: 16px; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .header { text-align: center; margin-bottom: 24px; }
        .brand { color: #38bdf8; font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }
        .subtitle { color: #94a3b8; font-size: 14px; }
        .reg-box { background-color: #0f172a; border: 2px dashed #38bdf8; border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 24px; }
        .reg-label { color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .reg-value { font-size: 28px; font-weight: 800; color: #f8fafc; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }
        .status-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
        .status-step { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 8px; background-color: #0f172a; opacity: 0.4; }
        .status-step.active { opacity: 1; border-left: 4px solid #38bdf8; }
        .status-step.completed { opacity: 1; border-left: 4px solid #22c55e; }
        .icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; background-color: #334155; color: #fff; font-size: 14px; }
        .active .icon { background-color: #38bdf8; color: #0f172a; }
        .completed .icon { background-color: #22c55e; color: #0f172a; }
        .info { flex: 1; }
        .title { font-weight: 600; font-size: 15px; }
        .desc { font-size: 12px; color: #94a3b8; }
        .footer { text-align: center; border-top: 1px solid #334155; padding-top: 16px; }
        .call-btn { display: inline-block; width: 100%; background-color: #22c55e; color: #ffffff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; text-align: center; transition: 0.2s; }
        .call-btn:hover { background-color: #16a34a; }
        .error-msg { color: #ef4444; font-size: 14px; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">Potgieter Auto</div>
        <div class="subtitle">Vehicle Service Tracker</div>
    </div>

    <div class="reg-box">
        <div class="reg-label">Registration Number</div>
        <div class="reg-value" id="regNum">LOADING...</div>
    </div>

    <div class="status-container">
        <div class="status-step completed">
            <div class="icon">✓</div>
            <div class="info">
                <div class="title">Vehicle Checked In</div>
                <div class="desc">Work order logged into workshop system</div>
            </div>
        </div>

        <div class="status-step active" id="stepService">
            <div class="icon">2</div>
            <div class="info">
                <div class="title">Service in Progress</div>
                <div class="desc">Technicians working on your vehicle</div>
            </div>
        </div>

        <div class="status-step" id="stepReady">
            <div class="icon">3</div>
            <div class="info">
                <div class="title">Ready for Collection</div>
                <div class="desc">Inspection complete, vehicle ready</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="tel:+27000000000" class="call-btn">📞 Call Potgieter Auto Workshop</a>
    </div>
</div>

<script>
    // Read ?reg= registration parameter from the Google Sheets link
    const params = new URLSearchParams(window.location.search);
    const regParam = params.get('reg');

    const regElement = document.getElementById('regNum');

    if (regParam && regParam.trim() !== "") {
        regElement.textContent = decodeURIComponent(regParam).toUpperCase();
    } else {
        regElement.textContent = "NO REG FOUND";
        regElement.style.color = "#ef4444";
    }
</script>

</body>
</html>
