<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMODA & JAECOO HATFIELD - Live Service Tracker</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #334155; }
    .card { background: #ffffff; border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); max-width: 550px; width: 100%; overflow: hidden; }
    .header { background: linear-gradient(135deg, #0b1f3a 0%, #1e3a8a 100%); color: #ffffff; padding: 30px 20px; text-align: center; }
    .header h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .header p { color: #93c5fd; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }
    .card-body { padding: 25px 20px; }
    .info-list { display: flex; flex-direction: column; gap: 12px; }
    .info-row { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 14px 18px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
    .label { font-size: 11px; font-weight: 800; color: #64748b; letter-spacing: 0.8px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
    .label i { font-size: 14px; color: #3b82f6; }
    .value { font-size: 14px; font-weight: 700; color: #0f172a; transition: all 0.3s ease; }
    .status-badge { background: #dcfce7; color: #15803d; border: 1px solid #86efac; padding: 6px 14px; border-radius: 30px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease; }
    .status-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    .call-btn-container { margin-top: 25px; }
    .call-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1><i class="fa-solid fa-car-side"></i> OMODA & JAECOO HATFIELD</h1>
      <p><i class="fa-solid fa-bolt"></i> Live Service Tracker</p>
    </div>

    <div class="card-body">
      <div class="info-list">
        
        <div class="info-row">
          <span class="label"><i class="fa-solid fa-id-card"></i> Registration Nr</span>
          <span class="value" id="reg-nr">Loading...</span>
        </div>

        <div class="info-row">
          <span class="label"><i class="fa-solid fa-user"></i> Customer Name</span>
          <span class="value" id="cust-name">Loading...</span>
        </div>

        <div class="info-row">
          <span class="label"><i class="fa-brands fa-whatsapp" style="color:#25D366;"></i> WhatsApp</span>
          <span class="value" id="cust-whatsapp">Loading...</span>
        </div>

        <div class="info-row">
          <span class="label"><i class="fa-solid fa-car"></i> Vehicle Model</span>
          <span class="value" id="vehicle-model">Loading...</span>
        </div>

        <div class="info-row">
          <span class="label"><i class="fa-solid fa-user-gear"></i> Technician</span>
          <span class="value" id="tech-assigned">Loading...</span>
        </div>

        <div class="info-row">
          <span class="label"><i class="fa-solid fa-gauge-high"></i> Current Status</span>
          <span class="status-badge">
            <span class="status-dot"></span> <span id="current-status">Loading...</span>
          </span>
        </div>

      </div>

      <div class="call-btn-container">
        <a href="tel:0120020664" class="call-btn">
          <i class="fa-solid fa-phone"></i> CALL DEALERSHIP
        </a>
      </div>
    </div>
  </div>

  <script>
    const PUSHER_KEY = '44dedb51dd5ce813e5f7';
    const PUSHER_CLUSTER = 'eu';

    const API_URL = 'https://script.google.com/macros/s/AKfycbwth_i4jS0a4jSrw2Usc4Y0mRAwY7NNsywipXZpBZhsfPPiqMuEN8bizhSbhCwGAyj9/exec';
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTv3NaMRF2nGAcEb9fP0EV2bpaonpMKdhvTf8goGCAWhq9GfpkQG1_AqbemXkOEbJio2mk_YUgQs6-W/pub?gid=0&single=true&output=csv';

    const urlParams = new URLSearchParams(window.location.search);
    const rawReg = urlParams.get('reg') || '';
    const cleanTargetReg = rawReg.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();

    function updateSingleRow(row) {
      document.getElementById('reg-nr').textContent = row[0] || rawReg;
      document.getElementById('cust-name').textContent = row[1] || '--';
      document.getElementById('cust-whatsapp').textContent = row[2] || '--';
      document.getElementById('vehicle-model').textContent = row[3] || '--';
      document.getElementById('tech-assigned').textContent = row[4] || '--';
      document.getElementById('current-status').textContent = row[6] || 'CHECKED IN';
    }

    function renderData(rows) {
      if (!cleanTargetReg) {
        document.getElementById('reg-nr').textContent = 'No Reg Provided';
        document.getElementById('cust-name').textContent = '--';
        document.getElementById('cust-whatsapp').textContent = '--';
        document.getElementById('vehicle-model').textContent = '--';
        document.getElementById('tech-assigned').textContent = '--';
        document.getElementById('current-status').textContent = 'N/A';
        return;
      }

      const matchedRow = rows.find(row => {
        const rowReg = String(row[0] || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        return rowReg === cleanTargetReg;
      });

      if (matchedRow) {
        updateSingleRow(matchedRow);
      } else {
        document.getElementById('reg-nr').textContent = rawReg;
        document.getElementById('cust-name').textContent = 'Vehicle Not Found';
        document.getElementById('cust-whatsapp').textContent = '--';
        document.getElementById('vehicle-model').textContent = '--';
        document.getElementById('tech-assigned').textContent = '--';
        document.getElementById('current-status').textContent = 'NOT FOUND';
      }
    }

    function fetchLiveData() {
      const cacheBuster = '&t=' + Date.now();
      
      fetch(API_URL + '?cache=' + Date.now(), { redirect: 'follow', cache: 'no-store' })
        .then(res => res.json())
        .then(rows => renderData(rows))
        .catch(() => {
          Papa.parse(SHEET_CSV_URL + cacheBuster, {
            download: true,
            header: false,
            skipEmptyLines: true,
            cache: false,
            complete: res => renderData(res.data)
          });
        });
    }

    // Initial Load
    fetchLiveData();

    // 5-Second Aggressive Fallback Poll to guarantee sync without pulling
    setInterval(fetchLiveData, 5000);

    // Real-time Websocket Listener via Pusher
    if (PUSHER_KEY) {
      const pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
      const channel = pusher.subscribe('tracker-channel');
      
      channel.bind('status-update', function(data) {
        if (data && data.row) {
          const rowReg = String(data.row[0] || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
          if (rowReg === cleanTargetReg) {
            updateSingleRow(data.row);
          }
        }
      });
    }
  </script>

</body>
</html>
