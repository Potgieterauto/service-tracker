<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMODA & JAECOO HATFIELD - Live Vehicle Service Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0b1e36;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #f8fafc;
            border-radius: 8px;
            word-break: break-word;
        }

        .info-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .info-value {
            font-size: 15px;
            color: #0f172a;
            font-weight: 600;
            text-align: right;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            background-color: #e2e8f0;
            color: #475569;
        }

        .message-box {
            text-align: center;
            padding: 30px 20px;
        }

        .error-title {
            color: #dc2626;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .error-sub {
            color: #64748b;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Omoda & Jaecoo Hatfield</h1>
            <p>Live Vehicle Service Tracker</p>
        </div>

        <div id="content">
            <div class="loading">Loading vehicle details...</div>
        </div>
    </div>

    <script>
        const BASE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTv3NaMRF2nGAcEb9fP0EV2bpaonpMKdhvTf8goGCAWhq9GfpkQG1_AqbemXkOEbJio2mk_YUgQs6-W/pub?gid=0&single=true&output=csv';
        
        // Refresh interval in milliseconds (5000ms = 5 seconds)
        const REFRESH_INTERVAL_MS = 5000; 

        let lastDataString = ''; // Track changes to avoid unnecessary re-renders

        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            const result = [];
            for (let i = 0; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const row = [];
                let insideQuotes = false;
                let entry = '';
                const line = lines[i];
                
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        if (insideQuotes && line[j + 1] === '"') {
                            entry += '"';
                            j++;
                        } else {
                            insideQuotes = !insideQuotes;
                        }
                    } else if (char === ',' && !insideQuotes) {
                        row.push(entry.trim());
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry.trim());
                result.push(row);
            }
            return result;
        }

        function cleanForCompare(str) {
            return str ? str.toString().toUpperCase().replace(/[^A-Z0-9]/g, '') : '';
        }

        async function fetchVehicleData(isInitialLoad = false) {
            const contentDiv = document.getElementById('content');
            const urlParams = new URLSearchParams(window.location.search);
            const targetReg = urlParams.get('reg');

            if (!targetReg) {
                contentDiv.innerHTML = `
                    <div class="message-box">
                        <div class="error-title">No Registration Provided</div>
                        <div class="error-sub">Please use a valid tracking link containing a vehicle registration number.</div>
                    </div>
                `;
                return;
            }

            try {
                // Append cache buster timestamp (?_t=123456) so browser always fetches live Google Sheet data
                const cacheBusterUrl = `${BASE_CSV_URL}&_t=${Date.now()}`;
                const response = await fetch(cacheBusterUrl, { cache: 'no-store' });

                if (!response.ok) throw new Error('Failed to fetch sheet data');

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length < 2) throw new Error('Database empty or missing headers');

                const rawHeaders = rows[0];
                const cleanedTargetReg = cleanForCompare(targetReg);

                const regIndex = rawHeaders.findIndex(h => {
                    const cleaned = cleanForCompare(h);
                    return cleaned.includes('REG') || cleaned.includes('REGISTRATION') || cleaned.includes('PLATE');
                });

                let matchedRowData = null;

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    
                    const isMatch = regIndex !== -1 
                        ? cleanForCompare(row[regIndex]) === cleanedTargetReg
                        : row.some(cell => cleanForCompare(cell) === cleanedTargetReg);

                    if (isMatch) {
                        matchedRowData = {};
                        rawHeaders.forEach((header, index) => {
                            const key = header.trim();
                            if (key) {
                                matchedRowData[key] = row[index] ? row[index].trim() : 'N/A';
                            }
                        });
                        break;
                    }
                }

                if (matchedRowData) {
                    // Only update the DOM if the underlying data actually changed
                    const currentDataString = JSON.stringify(matchedRowData);
                    if (currentDataString !== lastDataString) {
                        lastDataString = currentDataString;
                        displayVehicleInfo(matchedRowData);
                    }
                } else {
                    contentDiv.innerHTML = `
                        <div class="message-box">
                            <div class="error-title">No vehicle found for registration: <span style="color:#1e293b;">${targetReg.toUpperCase()}</span></div>
                            <div class="error-sub">Please check back shortly or contact your service advisor.</div>
                        </div>
                    `;
                }

            } catch (error) {
                console.error(error);
                if (isInitialLoad) {
                    contentDiv.innerHTML = `
                        <div class="message-box">
                            <div class="error-title">Unable to load tracker data</div>
                            <div class="error-sub">Please try refreshing the page or contact support.</div>
                        </div>
                    `;
                }
            }
        }

        function displayVehicleInfo(data) {
            const contentDiv = document.getElementById('content');
            let html = '<div class="card">';
            
            for (const [key, value] of Object.entries(data)) {
                if (!key || value === 'N/A' || value === '') continue;
                
                const isStatus = cleanForCompare(key).includes('STATUS');
                const valueMarkup = isStatus 
                    ? `<span class="status-badge">${value}</span>`
                    : `<span class="info-value">${value}</span>`;

                html += `
                    <div class="info-row">
                        <span class="info-label">${key}</span>
                        ${valueMarkup}
                    </div>
                `;
            }
            
            html += '</div>';
            contentDiv.innerHTML = html;
        }

        // Initial fetch
        fetchVehicleData(true);

        // Auto-refresh polling loop (fetches every 5 seconds)
        setInterval(() => {
            fetchVehicleData(false);
        }, REFRESH_INTERVAL_MS);
    </script>
</body>
</html>
